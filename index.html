<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Okul - Künefe App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* Kartlar */
        .auth-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 10px; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-main { background: #ff9f43; color: white; }
        .toggle-link { text-align: center; margin-top: 15px; color: #3498db; cursor: pointer; font-size: 14px; }

        /* Uygulama */
        #app-container { width: 100%; height: 100vh; background: #fff; display: flex; flex-direction: column; position: fixed; top:0; left:0; z-index: 100; }
        header { padding: 15px 20px; background: #ff9f43; color: white; display: flex; justify-content: space-between; align-items: center; }
        .admin-badge { background: #d63031; padding: 6px 15px; border-radius: 25px; font-size: 12px; font-weight: bold; }
        main { flex: 1; padding: 20px; overflow-y: auto; text-align: center; }

        /* Alt Menü */
        .bottom-nav { height: 70px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #a4b0be; cursor: pointer; font-size: 11px; flex: 1; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: #ff9f43; }

        .modal-bg { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index: 200; }
        .modal { background: white; padding: 2rem; border-radius: 15px; text-align: center; width: 300px; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="auth-screen" class="auth-card">
        <h2 id="auth-title" style="text-align:center; margin-bottom:15px;">Hoş Geldin</h2>
        <div id="login-fields">
            <input type="text" id="login-user" placeholder="Kullanıcı Adı">
            <input type="password" id="login-pass" placeholder="Şifre">
            <button class="btn-main" onclick="window.app.login()">Giriş Yap</button>
            <div class="toggle-link" onclick="window.app.toggleAuth(true)">Hesap Oluştur</div>
        </div>
        <div id="register-fields" class="hidden">
            <input type="email" id="reg-email" placeholder="E-posta">
            <input type="text" id="reg-user" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-pass" placeholder="Şifre">
            <button class="btn-main" onclick="window.app.startRegister()">Kod Gönder</button>
            <div class="toggle-link" onclick="window.app.toggleAuth(false)">Geri Dön</div>
        </div>
    </div>

    <!-- DOĞRULAMA MODAL -->
    <div id="verify-modal" class="modal-bg hidden">
        <div class="modal">
            <h3>Doğrulama</h3>
            <input type="text" id="verify-code" maxlength="4" style="text-align:center; font-size: 24px; margin-top:10px;">
            <button class="btn-main" onclick="window.app.verifyAndFinish()">Onayla</button>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div id="app-container" class="hidden">
        <header>
            <div style="font-weight: 600;">Merhaba, <span id="display-name"></span></div>
            <div id="admin-btn" class="admin-badge hidden">ADMİN</div>
        </header>
        <main id="main-content">
            <h1>Ana Sayfa</h1>
            <p style="margin-top:15px; color:#666;">Bizim Okul uygulamasına başarıyla giriş yaptın.</p>
        </main>
        <nav class="bottom-nav">
            <div class="nav-item" onclick="window.app.navigate('users', this)"><i class="fas fa-users"></i><span>Kullanıcılar</span></div>
            <div class="nav-item active" onclick="window.app.navigate('home', this)"><i class="fas fa-home"></i><span>Ana Sayfa</span></div>
            <div class="nav-item" onclick="window.app.navigate('forum', this)"><i class="fas fa-comments"></i><span>Forum</span></div>
            <div class="nav-item" onclick="window.app.navigate('messages', this)"><i class="fas fa-envelope"></i><span>Mesaj</span></div>
            <div class="nav-item" onclick="window.app.navigate('settings', this)"><i class="fas fa-cog"></i><span>Ayarlar</span></div>
            <div class="nav-item" onclick="window.app.navigate('updates', this)"><i class="fas fa-sync"></i><span>Güncelleme</span></div>
        </nav>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjs49askwa3CJi9MY_ABhK2l1umFLuEZo",
            authDomain: "bizimokul14-4d546.firebaseapp.com",
            projectId: "bizimokul14-4d546",
            storageBucket: "bizimokul14-4d546.firebasestorage.app",
            messagingSenderId: "144133286740",
            appId: "1:144133286740:web:5ce1ad633fed06233376c1"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getFirestore(fApp);
        
        emailjs.init("bgyhgWde8icqWQ5gB"); 

        const appLogic = {
            generatedCode: null,
            tempUser: null,

            toggleAuth(isReg) {
                document.getElementById('login-fields').classList.toggle('hidden', isReg);
                document.getElementById('register-fields').classList.toggle('hidden', !isReg);
                document.getElementById('auth-title').innerText = isReg ? "Kayıt Ol" : "Giriş Yap";
            },

            async startRegister() {
                const email = document.getElementById('reg-email').value;
                const user = document.getElementById('reg-user').value;
                const pass = document.getElementById('reg-pass').value;

                if(!email || !user || !pass) return alert("Boş alan bırakma!");

                const q = query(collection(db, "users"), where("username", "==", user));
                const snap = await getDocs(q);
                if(!snap.empty) return alert("Bu kullanıcı adı alınmış!");

                this.generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
                this.tempUser = { email, username: user, password: pass };

                emailjs.send("service_9rbygdk", "template_ygxjrhm", {
                    to_email: email,
                    code: this.generatedCode
                }).then(() => {
                    document.getElementById('verify-modal').classList.remove('hidden');
                    alert("E-postana kod gönderildi!");
                }).catch(() => alert("EmailJS Hatası! Bilgileri kontrol et."));
            },

            async verifyAndFinish() {
                const val = document.getElementById('verify-code').value;
                if(val === this.generatedCode) {
                    await setDoc(doc(db, "users", this.tempUser.username), this.tempUser);
                    alert("Kayıt başarılı! Giriş yapabilirsin.");
                    location.reload();
                } else {
                    alert("Kod yanlış!");
                }
            },

            async login() {
                const user = document.getElementById('login-user').value;
                const pass = document.getElementById('login-pass').value;
                if(!user || !pass) return alert("Alanları doldur!");

                const userDoc = await getDoc(doc(doc(db, "users", user)));

                if(userDoc.exists() && userDoc.data().password === pass) {
                    this.launch(userDoc.data().username);
                } else {
                    alert("Hatalı kullanıcı adı veya şifre!");
                }
            },

            launch(username) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('display-name').innerText = username;
                if(username.toLowerCase() === "künefe") {
                    document.getElementById('admin-btn').classList.remove('hidden');
                }
            },

            navigate(page, el) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                el.classList.add('active');
                
                const pages = {
                    home: "<h1>Ana Sayfa</h1><p>Hoş geldin!</p>",
                    users: "<h1>Kullanıcılar</h1><p>Arkadaşlarını gör.</p>",
                    forum: "<h1>Forum</h1><p>Tartışmalara katıl.</p>",
                    messages: "<h1>Mesajlar</h1><p>Gelen kutusu.</p>",
                    settings: "<h1>Ayarlar</h1><p>Profilini düzenle.</p>",
                    updates: "<h1>Güncelleme</h1><p>v1.0.3 - Butonlar Onarıldı!</p>"
                };
                document.getElementById('main-content').innerHTML = pages[page];
            }
        };

        // BUTONLARI ÇALIŞTIRAN EN ÖNEMLİ KISIM:
        window.app = appLogic;
    </script>
</body>
</html>
