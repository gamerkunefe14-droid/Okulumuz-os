<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Okul App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* Kart Yapısı */
        .auth-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 420px; z-index: 10; }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #2d3436; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 10px; outline: none; }
        input:focus { border-color: #ff9f43; }
        
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-main { background: #ff9f43; color: white; }
        .btn-main:hover { background: #f39c12; }
        .toggle-link { text-align: center; margin-top: 15px; color: #3498db; cursor: pointer; font-size: 14px; }

        /* Uygulama Arayüzü */
        #app-container { width: 100%; height: 100vh; background: #fff; display: flex; flex-direction: column; position: fixed; top:0; left:0; z-index: 20; }
        header { padding: 15px 20px; background: #ff9f43; color: white; display: flex; justify-content: space-between; align-items: center; }
        .admin-btn { background: #d63031; padding: 6px 15px; border-radius: 25px; font-size: 13px; font-weight: bold; }
        
        main { flex: 1; padding: 25px; overflow-y: auto; text-align: center; background: #fafafa; }

        /* Alt Menü */
        .bottom-nav { height: 70px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #a4b0be; cursor: pointer; font-size: 11px; flex: 1; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: #ff9f43; }

        /* Doğrulama Modal */
        .modal-bg { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index: 100; }
        .modal { background: white; padding: 2rem; border-radius: 15px; text-align: center; width: 320px; }
    </style>
</head>
<body>

    <!-- GİRİŞ/KAYIT FORMU -->
    <div id="auth-screen" class="auth-card">
        <h2 id="auth-title">Giriş Yap</h2>
        <div id="login-fields">
            <input type="text" id="login-user" placeholder="Kullanıcı Adı">
            <input type="password" id="login-pass" placeholder="Şifre">
            <button class="btn-main" onclick="app.login()">Giriş Yap</button>
            <div class="toggle-link" onclick="app.toggleAuth(true)">Kayıt Ol</div>
        </div>
        <div id="register-fields" class="hidden">
            <input type="email" id="reg-email" placeholder="E-posta">
            <input type="text" id="reg-user" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-pass" placeholder="Şifre">
            <button class="btn-main" onclick="app.startRegister()">Kod Gönder</button>
            <div class="toggle-link" onclick="app.toggleAuth(false)">Geri Dön</div>
        </div>
    </div>

    <!-- DOĞRULAMA MODAL -->
    <div id="verify-modal" class="modal-bg hidden">
        <div class="modal">
            <h3>Kodu Gir</h3>
            <input type="text" id="verify-code" maxlength="4" style="text-align:center; font-size: 24px;">
            <button class="btn-main" onclick="app.verifyAndFinish()">Onayla</button>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div id="app-container" class="hidden">
        <header>
            <div>Selam, <span id="display-name"></span></div>
            <div id="admin-btn" class="admin-btn hidden">ADMİN</div>
        </header>
        <main id="main-content">
            <h1>Ana Sayfa</h1>
            <p>Hoş geldin!</p>
        </main>
        <nav class="bottom-nav">
            <div class="nav-item" onclick="app.navigate('users', this)"><i class="fas fa-users"></i><span>Kullanıcılar</span></div>
            <div class="nav-item active" onclick="app.navigate('home', this)"><i class="fas fa-home"></i><span>Ana Sayfa</span></div>
            <div class="nav-item" onclick="app.navigate('forum', this)"><i class="fas fa-comments"></i><span>Forum</span></div>
            <div class="nav-item" onclick="app.navigate('messages', this)"><i class="fas fa-envelope"></i><span>Mesaj</span></div>
            <div class="nav-item" onclick="app.navigate('settings', this)"><i class="fas fa-cog"></i><span>Ayarlar</span></div>
            <div class="nav-item" onclick="app.navigate('updates', this)"><i class="fas fa-sync"></i><span>Güncelleme</span></div>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjs49askwa3CJi9MY_ABhK2l1umFLuEZo",
            authDomain: "bizimokul14-4d546.firebaseapp.com",
            projectId: "bizimokul14-4d546",
            storageBucket: "bizimokul14-4d546.firebasestorage.app",
            messagingSenderId: "144133286740",
            appId: "1:144133286740:web:5ce1ad633fed06233376c1"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getFirestore(fApp);
        
        // ÖNEMLİ: Kendi EmailJS Public Key'ini buraya yaz!
        emailjs.init("YOUR_PUBLIC_KEY"); 

        const app = {
            generatedCode: null,
            tempUser: null,

            toggleAuth(isReg) {
                document.getElementById('login-fields').classList.toggle('hidden', isReg);
                document.getElementById('register-fields').classList.toggle('hidden', !isReg);
            },

            async startRegister() {
                const email = document.getElementById('reg-email').value;
                const user = document.getElementById('reg-user').value;
                const pass = document.getElementById('reg-pass').value;

                const q = query(collection(db, "users"), where("username", "==", user));
                const snap = await getDocs(q);
                if(!snap.empty) return alert("Kullanıcı adı alınmış!");

                this.generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
                this.tempUser = { email, username: user, password: pass };

                // EmailJS Service ID ve Template ID buraya!
                emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                    to_email: email,
                    code: this.generatedCode
                }).then(() => {
                    document.getElementById('verify-modal').classList.remove('hidden');
                }).catch(() => alert("EmailJS Hatası! Kodları kontrol et."));
            },

            async verifyAndFinish() {
                if(document.getElementById('verify-code').value === this.generatedCode) {
                    await setDoc(doc(db, "users", this.tempUser.username), this.tempUser);
                    alert("Kayıt tamam!");
                    location.reload();
                } else {
                    alert("Kod yanlış!");
                }
            },

            async login() {
                const user = document.getElementById('login-user').value;
                const pass = document.getElementById('login-pass').value;
                const userDoc = await getDoc(doc(db, "users", user));

                if(userDoc.exists() && userDoc.data().password === pass) {
                    this.launch(userDoc.data().username);
                } else {
                    alert("Hatalı giriş!");
                }
            },

            launch(username) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('display-name').innerText = username;
                if(username.toLowerCase() === "künefe") document.getElementById('admin-btn').classList.remove('hidden');
            },

            navigate(page, element) {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                element.classList.add('active');
                const pages = {
                    home: "<h1>Ana Sayfa</h1><p>Hoş geldin!</p>",
                    users: "<h1>Kullanıcılar</h1><p>Liste yükleniyor...</p>",
                    forum: "<h1>Forum</h1><p>Sohbet alanı.</p>",
                    messages: "<h1>Mesajlar</h1><p>Kutunuz boş.</p>",
                    settings: "<h1>Ayarlar</h1><p>Profil ayarları.</p>",
                    updates: "<h1>Güncelleme</h1><p>Sürüm 1.0.1</p>"
                };
                document.getElementById('main-content').innerHTML = pages[page];
            }
        };

        // BUTONLARIN ÇALIŞMASI İÇİN KRİTİK SATIR:
        window.app = app;
    </script>
</body>
</html>
