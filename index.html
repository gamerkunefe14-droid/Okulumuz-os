<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Okul - Admin Panel v2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* Kartlar */
        .auth-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 10px; outline: none; background: #fff; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .btn-main { background: #ff9f43; color: white; }
        .btn-danger { background: #d63031; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .toggle-link { text-align: center; margin-top: 15px; color: #3498db; cursor: pointer; font-size: 14px; }

        /* Uygulama Ekranı */
        #app-container { width: 100%; height: 100vh; background: #fff; display: flex; flex-direction: column; position: fixed; top:0; left:0; z-index: 100; }
        header { padding: 15px 20px; background: #ff9f43; color: white; display: flex; justify-content: space-between; align-items: center; }
        .admin-badge { background: #d63031; padding: 6px 15px; border-radius: 25px; font-size: 12px; font-weight: bold; cursor: pointer; }
        main { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; }

        /* Admin GUI & Listeler */
        .user-item { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .user-item:hover { background: #f9f9f9; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-active { background: #2ecc71; }
        .status-blocked { background: #e74c3c; }

        /* Alt Menü */
        .bottom-nav { height: 70px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #a4b0be; cursor: pointer; font-size: 11px; flex: 1; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: #ff9f43; }

        /* Modallar */
        .modal-bg { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index: 500; }
        .modal { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- GİRİŞ/KAYIT EKRANI -->
    <div id="auth-screen" class="auth-card">
        <h2 id="auth-title" style="text-align:center; margin-bottom:15px;">Giriş Yap</h2>
        
        <div id="login-fields">
            <input type="text" id="login-user" placeholder="Kullanıcı Adı">
            <input type="password" id="login-pass" placeholder="Şifre">
            <button class="btn-main" onclick="app.login()">Giriş Yap</button>
            <div class="toggle-link" onclick="app.toggleAuth(true)">Hesap Oluştur</div>
        </div>

        <div id="register-fields" class="hidden">
            <input type="email" id="reg-email" placeholder="E-posta">
            <input type="text" id="reg-user" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-pass" placeholder="Şifre">
            
            <select id="reg-school"><option value="">Okul Seçin</option></select>
            
            <div style="display: flex; gap: 10px;">
                <select id="reg-grade"></select>
                <select id="reg-section"></select>
            </div>

            <button class="btn-main" onclick="app.startRegister()">Kod Gönder</button>
            <div class="toggle-link" onclick="app.toggleAuth(false)">Geri Dön</div>
        </div>
    </div>

    <!-- DOĞRULAMA MODALI -->
    <div id="verify-modal" class="modal-bg hidden">
        <div class="modal">
            <h3>Onay Kodu</h3>
            <input type="text" id="verify-code" maxlength="4" style="text-align:center; font-size: 24px;">
            <button class="btn-main" onclick="app.verifyAndFinish()">Tamamla</button>
        </div>
    </div>

    <!-- ADMİN: KULLANICI DÜZENLEME MODALI -->
    <div id="admin-user-modal" class="modal-bg hidden">
        <div class="modal">
            <h3 id="edit-user-title">Kullanıcı Düzenle</h3>
            <hr style="margin: 10px 0;">
            <label>Okul:</label><select id="edit-school"></select>
            <label>Sınıf:</label><select id="edit-grade"></select>
            <label>Şube:</label><select id="edit-section"></select>
            
            <button id="block-btn" class="btn-danger" onclick="app.adminUpdateStatus(true)">Girişi Engelle</button>
            <button id="unblock-btn" class="btn-success hidden" onclick="app.adminUpdateStatus(false)">Engeli Kaldır</button>
            <button class="btn-main" onclick="app.adminMakeLeader()">Sınıf Başkanı Yap</button>
            <button class="btn-main" style="background:#34495e" onclick="app.saveUserEdits()">Değişiklikleri Kaydet</button>
            <button onclick="document.getElementById('admin-user-modal').classList.add('hidden')">Kapat</button>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div id="app-container" class="hidden">
        <header>
            <div><i class="fas fa-user-circle"></i> <span id="display-name"></span></div>
            <div id="admin-btn" class="admin-badge hidden" onclick="app.navigate('admin')">ADMİN PANELİ</div>
        </header>
        <main id="main-content">
            <!-- İçerik buraya dinamik gelecek -->
        </main>
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="app.navigate('home', this)"><i class="fas fa-home"></i><span>Ana Sayfa</span></div>
            <div class="nav-item" onclick="app.navigate('users', this)"><i class="fas fa-users"></i><span>Kullanıcılar</span></div>
            <div class="nav-item" onclick="app.navigate('admin', this)" id="nav-admin-icon" class="hidden"><i class="fas fa-tools"></i><span>Admin</span></div>
            <div class="nav-item" onclick="app.navigate('settings', this)"><i class="fas fa-cog"></i><span>Ayarlar</span></div>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjs49askwa3CJi9MY_ABhK2l1umFLuEZo",
            authDomain: "bizimokul14-4d546.firebaseapp.com",
            projectId: "bizimokul14-4d546",
            storageBucket: "bizimokul14-4d546.firebasestorage.app",
            messagingSenderId: "144133286740",
            appId: "1:144133286740:web:5ce1ad633fed06233376c1"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getFirestore(fApp);
        emailjs.init("bgyhgWde8icqWQ5gB");

        window.app = {
            currentUser: null,
            allSchools: [],
            selectedEditUser: null,

            async init() {
                // Sınıf ve Şube Selectlerini Doldur
                const gSelect = document.getElementById('reg-grade');
                for(let i=1; i<=12; i++) gSelect.innerHTML += `<option value="${i}">${i}. Sınıf</option>`;
                
                const sSelect = document.getElementById('reg-section');
                "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ".split("").forEach(char => {
                    sSelect.innerHTML += `<option value="${char}">${char} Şubesi</option>`;
                });

                // Okulları Getir
                await this.fetchSchools();
            },

            async fetchSchools() {
                const snap = await getDoc(doc(db, "config", "schools"));
                this.allSchools = snap.exists() ? snap.data().list : ["Bolu Ortaokulu"];
                const selects = [document.getElementById('reg-school'), document.getElementById('edit-school')];
                selects.forEach(s => {
                    if(!s) return;
                    s.innerHTML = '<option value="">Okul Seçin</option>';
                    this.allSchools.forEach(sch => s.innerHTML += `<option value="${sch}">${sch}</option>`);
                });
            },

            toggleAuth(isReg) {
                document.getElementById('login-fields').classList.toggle('hidden', isReg);
                document.getElementById('register-fields').classList.toggle('hidden', !isReg);
            },

            async startRegister() {
                const user = document.getElementById('reg-user').value;
                const email = document.getElementById('reg-email').value;
                const school = document.getElementById('reg-school').value;
                if(!user || !school) return alert("Tüm alanları doldur!");

                this.generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
                this.tempUser = {
                    username: user,
                    email: email,
                    password: document.getElementById('reg-pass').value,
                    school: school,
                    grade: document.getElementById('reg-grade').value,
                    section: document.getElementById('reg-section').value,
                    isBlocked: false,
                    isLeader: false
                };

                await emailjs.send("service_9rbygdk", "template_ygxjrhm", { to_email: email, code: this.generatedCode });
                document.getElementById('verify-modal').classList.remove('hidden');
            },

            async verifyAndFinish() {
                if(document.getElementById('verify-code').value === this.generatedCode) {
                    await setDoc(doc(db, "users", this.tempUser.username), this.tempUser);
                    alert("Kayıt tamam!");
                    location.reload();
                }
            },

            async login() {
                const id = document.getElementById('login-user').value;
                const pass = document.getElementById('login-pass').value;
                const userDoc = await getDoc(doc(db, "users", id));

                if(userDoc.exists() && userDoc.data().password === pass) {
                    if(userDoc.data().isBlocked) return alert("Hesabınız admin tarafından engellenmiştir!");
                    this.currentUser = userDoc.data();
                    this.launch();
                } else alert("Hatalı giriş!");
            },

            launch() {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('display-name').innerText = this.currentUser.username;
                
                if(this.currentUser.username.toLowerCase() === "künefe") {
                    document.getElementById('admin-btn').classList.remove('hidden');
                    document.getElementById('nav-admin-icon').classList.remove('hidden');
                }
                this.navigate('home');
            },

            async navigate(page, el) {
                if(el) {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    el.classList.add('active');
                }
                const main = document.getElementById('main-content');

                if(page === 'home') {
                    main.innerHTML = `<h2>Ana Sayfa</h2><p>${this.currentUser.school} - ${this.currentUser.grade}/${this.currentUser.section}</p>`;
                } 
                else if(page === 'admin') {
                    this.renderAdminPanel();
                }
            },

            async renderAdminPanel() {
                const main = document.getElementById('main-content');
                main.innerHTML = `
                    <h3>Admin Kontrol Paneli</h3>
                    <div style="margin:15px 0; background:#eee; padding:10px; border-radius:10px;">
                        <input type="text" id="new-school-name" placeholder="Okul Adı">
                        <button class="btn-success" onclick="app.addSchool()">Yeni Okul Ekle</button>
                    </div>
                    <hr>
                    <h4 style="margin:10px 0;">Kullanıcı Listesi</h4>
                    <div id="admin-user-list">Yükleniyor...</div>
                `;

                const snap = await getDocs(collection(db, "users"));
                const listDiv = document.getElementById('admin-user-list');
                listDiv.innerHTML = "";
                
                snap.forEach(uDoc => {
                    const u = uDoc.data();
                    const item = document.createElement('div');
                    item.className = 'user-item';
                    item.innerHTML = `
                        <span>
                            <span class="status-dot ${u.isBlocked ? 'status-blocked' : 'status-active'}"></span>
                            <b>${u.username}</b> ${u.isLeader ? '(Başkan)' : ''}
                        </span>
                        <small>${u.school} | ${u.grade}-${u.section}</small>
                    `;
                    item.onclick = () => this.openUserEdit(u);
                    listDiv.appendChild(item);
                });
            },

            async addSchool() {
                const name = document.getElementById('new-school-name').value;
                if(!name) return;
                this.allSchools.push(name);
                await setDoc(doc(db, "config", "schools"), { list: this.allSchools });
                alert("Okul eklendi!");
                this.renderAdminPanel();
                this.fetchSchools();
            },

            openUserEdit(user) {
                this.selectedEditUser = user;
                document.getElementById('admin-user-modal').classList.remove('hidden');
                document.getElementById('edit-user-title').innerText = user.username + " Düzenleniyor";
                
                // Formu doldur
                const s = document.getElementById('edit-school');
                s.innerHTML = "";
                this.allSchools.forEach(sch => s.innerHTML += `<option value="${sch}">${sch}</option>`);
                s.value = user.school;

                const g = document.getElementById('edit-grade');
                g.innerHTML = "";
                for(let i=1; i<=12; i++) g.innerHTML += `<option value="${i}">${i}</option>`;
                g.value = user.grade;

                const sec = document.getElementById('edit-section');
                sec.innerHTML = "";
                "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ".split("").forEach(char => {
                    sec.innerHTML += `<option value="${char}">${char}</option>`;
                });
                sec.value = user.section;

                document.getElementById('block-btn').classList.toggle('hidden', user.isBlocked);
                document.getElementById('unblock-btn').classList.toggle('hidden', !user.isBlocked);
            },

            async adminUpdateStatus(status) {
                await updateDoc(doc(db, "users", this.selectedEditUser.username), { isBlocked: status });
                alert("Durum güncellendi!");
                document.getElementById('admin-user-modal').classList.add('hidden');
                this.renderAdminPanel();
            },

            async adminMakeLeader() {
                await updateDoc(doc(db, "users", this.selectedEditUser.username), { isLeader: true });
                alert("Sınıf başkanı atandı!");
                this.renderAdminPanel();
            },

            async saveUserEdits() {
                const updates = {
                    school: document.getElementById('edit-school').value,
                    grade: document.getElementById('edit-grade').value,
                    section: document.getElementById('edit-section').value
                };
                await updateDoc(doc(db, "users", this.selectedEditUser.username), updates);
                alert("Kullanıcı bilgileri güncellendi!");
                document.getElementById('admin-user-modal').classList.add('hidden');
                this.renderAdminPanel();
            }
        };

        window.app.init();
    </script>
</body>
</html>
