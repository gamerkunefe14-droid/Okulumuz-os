<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Okul - Künefe App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --text: #333; --nav: #ffffff; }
        .dark-mode { --bg: #18191a; --card: #242526; --text: #e4e6eb; --nav: #242526; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background 0.2s; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* Kartlar ve Formlar */
        .auth-card { background: var(--card); padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 450px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 10px; outline: none; background: var(--card); color: var(--text); }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .btn-main { background: #ff9f43; color: white; }
        .btn-danger { background: #d63031; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .toggle-link { text-align: center; margin-top: 15px; color: #3498db; cursor: pointer; font-size: 14px; }

        /* Uygulama Ekranı */
        #app-container { width: 100%; height: 100vh; background: var(--bg); display: flex; flex-direction: column; position: fixed; top:0; left:0; z-index: 100; }
        header { padding: 15px 20px; background: #ff9f43; color: white; display: flex; justify-content: space-between; align-items: center; }
        .admin-badge { background: #d63031; padding: 6px 15px; border-radius: 25px; font-size: 12px; font-weight: bold; cursor: pointer; }
        main { flex: 1; padding: 15px; overflow-y: auto; }

        /* Listeler */
        .user-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-active { background: #2ecc71; }
        .status-blocked { background: #e74c3c; }

        /* WhatsApp Stili Mesajlaşma */
        #chat-window { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 600; display: flex; flex-direction: column; }
        .msg-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .bubble { max-width: 70%; padding: 10px; border-radius: 15px; margin-bottom: 10px; font-size: 14px; }
        .msg-me { align-self: flex-end; background: #ff9f43; color: white; }
        .msg-them { align-self: flex-start; background: var(--card); }

        /* Navigasyon */
        .bottom-nav { height: 70px; background: var(--nav); border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #a4b0be; cursor: pointer; font-size: 11px; flex: 1; }
        .nav-item.active { color: #ff9f43; }

        /* Modallar */
        .modal-bg { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index: 1000; }
        .modal { background: var(--card); padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- GİRİŞ/KAYIT -->
    <div id="auth-screen" class="auth-card">
        <h2 id="auth-title" style="text-align:center; margin-bottom:15px;">Giriş Yap</h2>
        <div id="login-fields">
            <input type="text" id="login-user" placeholder="Kullanıcı Adı">
            <input type="password" id="login-pass" placeholder="Şifre">
            <button class="btn-main" onclick="app.login()">Giriş Yap</button>
            <div class="toggle-link" onclick="app.toggleAuth(true)">Hesap Oluştur</div>
        </div>
        <div id="register-fields" class="hidden">
            <input type="email" id="reg-email" placeholder="E-posta">
            <input type="text" id="reg-user" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-pass" placeholder="Şifre">
            <select id="reg-school"></select>
            <div style="display:flex; gap:5px;"><select id="reg-grade"></select><select id="reg-section"></select></div>
            <button class="btn-main" onclick="app.startRegister()">Kod Gönder</button>
            <div class="toggle-link" onclick="app.toggleAuth(false)">Geri Dön</div>
        </div>
    </div>

    <!-- APP -->
    <div id="app-container" class="hidden">
        <header>
            <div><i class="fas fa-user-circle"></i> <span id="display-name"></span></div>
            <div id="admin-btn" class="admin-badge hidden" onclick="app.navigate('admin')">ADMİN</div>
        </header>
        <main id="main-content"></main>
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="app.navigate('home', this)"><i class="fas fa-home"></i><span>Ana Sayfa</span></div>
            <div class="nav-item" onclick="app.navigate('messages', this)"><i class="fas fa-comments"></i><span>Mesajlar</span></div>
            <div class="nav-item" onclick="app.navigate('users', this)"><i class="fas fa-users"></i><span>Okul</span></div>
            <div class="nav-item" onclick="app.navigate('settings', this)"><i class="fas fa-cog"></i><span>Ayarlar</span></div>
        </nav>
    </div>

    <!-- ESKİ ADMİN KULLANICI GUI (MODAL) -->
    <div id="admin-user-modal" class="modal-bg hidden">
        <div class="modal">
            <h3 id="edit-user-title">Kullanıcı Düzenle</h3>
            <hr style="margin: 10px 0;">
            <label>Okul:</label><select id="edit-school"></select>
            <label>Sınıf:</label><select id="edit-grade"></select>
            <label>Şube:</label><select id="edit-section"></select>
            <button id="block-btn" class="btn-danger" onclick="app.adminUpdateStatus(true)">Girişi Engelle</button>
            <button id="unblock-btn" class="btn-success hidden" onclick="app.adminUpdateStatus(false)">Engeli Kaldır</button>
            <button class="btn-main" onclick="app.adminMakeLeader()">Sınıf Başkanı Yap</button>
            <button class="btn-main" style="background:#34495e" onclick="app.saveUserEdits()">Kaydet</button>
            <button onclick="document.getElementById('admin-user-modal').classList.add('hidden')">Kapat</button>
        </div>
    </div>

    <!-- CHAT WINDOW -->
    <div id="chat-window" class="hidden">
        <header style="background:#ff9f43; padding:15px; display:flex; align-items:center;">
            <i class="fas fa-arrow-left" style="cursor:pointer; margin-right:15px;" onclick="document.getElementById('chat-window').classList.add('hidden')"></i>
            <span id="chat-target-name" style="font-weight:bold;">Sohbet</span>
        </header>
        <div class="msg-container" id="chat-messages"></div>
        <div style="padding:10px; display:flex; gap:5px; background:var(--card);">
            <input type="text" id="msg-input" placeholder="Mesaj..." style="margin:0;">
            <button class="btn-main" style="width:60px; margin:0;" onclick="app.sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- VERIFY MODAL -->
    <div id="verify-modal" class="modal-bg hidden">
        <div class="modal">
            <h3>Doğrulama</h3>
            <input type="text" id="verify-code" maxlength="4" style="text-align:center; font-size:24px;">
            <button class="btn-main" onclick="app.verifyAndFinish()">Onayla</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc, onSnapshot, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjs49askwa3CJi9MY_ABhK2l1umFLuEZo",
            authDomain: "bizimokul14-4d546.firebaseapp.com",
            projectId: "bizimokul14-4d546",
            storageBucket: "bizimokul14-4d546.firebasestorage.app",
            messagingSenderId: "144133286740",
            appId: "1:144133286740:web:5ce1ad633fed06233376c1"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getFirestore(fApp);
        emailjs.init("bgyhgWde8icqWQ5gB");

        window.app = {
            currentUser: null,
            allSchools: [],
            activeChat: null,
            unsubscribeChat: null,
            selectedEditUser: null,

            async init() {
                const gSelects = [document.getElementById('reg-grade'), document.getElementById('edit-grade')];
                gSelects.forEach(s => { for(let i=1; i<=12; i++) s.innerHTML += `<option value="${i}">${i}. Sınıf</option>`; });
                const sSelects = [document.getElementById('reg-section'), document.getElementById('edit-section')];
                sSelects.forEach(s => { "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ".split("").forEach(char => s.innerHTML += `<option value="${char}">${char}</option>`); });
                await this.fetchSchools();
            },

            async fetchSchools() {
                const snap = await getDoc(doc(db, "config", "schools"));
                this.allSchools = snap.exists() ? snap.data().list : [];
                const selects = [document.getElementById('reg-school'), document.getElementById('edit-school')];
                selects.forEach(s => {
                    s.innerHTML = this.allSchools.length ? "" : '<option>Okul Ekleyin</option>';
                    this.allSchools.forEach(sch => s.innerHTML += `<option value="${sch}">${sch}</option>`);
                });
            },

            toggleAuth(isReg) {
                document.getElementById('login-fields').classList.toggle('hidden', isReg);
                document.getElementById('register-fields').classList.toggle('hidden', !isReg);
            },

            async startRegister() {
                const email = document.getElementById('reg-email').value;
                this.generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
                this.tempUser = {
                    username: document.getElementById('reg-user').value,
                    email: email, password: document.getElementById('reg-pass').value,
                    school: document.getElementById('reg-school').value,
                    grade: document.getElementById('reg-grade').value,
                    section: document.getElementById('reg-section').value,
                    isBlocked: false, isLeader: false
                };
                await emailjs.send("service_9rbygdk", "template_ygxjrhm", { to_email: email, code: this.generatedCode });
                document.getElementById('verify-modal').classList.remove('hidden');
            },

            async verifyAndFinish() {
                if(document.getElementById('verify-code').value === this.generatedCode) {
                    await setDoc(doc(db, "users", this.tempUser.username), this.tempUser);
                    location.reload();
                }
            },

            async login() {
                const id = document.getElementById('login-user').value;
                const pass = document.getElementById('login-pass').value;
                const userDoc = await getDoc(doc(db, "users", id));
                if(userDoc.exists() && userDoc.data().password === pass) {
                    if(userDoc.data().isBlocked) return alert("Engellendiniz!");
                    this.currentUser = userDoc.data();
                    this.launch();
                } else alert("Hatalı Giriş!");
            },

            launch() {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('display-name').innerText = this.currentUser.username;
                if(this.currentUser.username.toLowerCase() === "künefe") document.getElementById('admin-btn').classList.remove('hidden');
                this.navigate('home');
            },

            async navigate(page, el) {
                if(el) {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    el.classList.add('active');
                }
                const main = document.getElementById('main-content');
                if(page === 'home') main.innerHTML = `<h3>Hoş Geldin</h3><p>${this.currentUser.school} / ${this.currentUser.grade}-${this.currentUser.section}</p>`;
                if(page === 'messages') this.renderMessageList();
                if(page === 'users') main.innerHTML = `<h3>Okul Listesi</h3><p>Yakında aktif...</p>`;
                if(page === 'settings') this.renderSettings();
                if(page === 'admin') this.renderAdminPanel();
            },

            // MESSAGES (WHATSAPP)
            async renderMessageList() {
                const main = document.getElementById('main-content');
                main.innerHTML = '<h3>Mesajlar</h3><div id="msg-list"></div>';
                const snap = await getDocs(collection(db, "users"));
                snap.forEach(uDoc => {
                    const u = uDoc.data();
                    if(u.username === this.currentUser.username) return;
                    const div = document.createElement('div');
                    div.className = 'user-item';
                    div.innerHTML = `<b>${u.username}</b> <small>${u.school}</small>`;
                    div.onclick = () => this.openChat(u.username);
                    document.getElementById('msg-list').appendChild(div);
                });
            },

            openChat(target) {
                this.activeChat = target;
                document.getElementById('chat-window').classList.remove('hidden');
                document.getElementById('chat-target-name').innerText = target;
                const chatId = [this.currentUser.username, target].sort().join("_");
                if(this.unsubscribeChat) this.unsubscribeChat();
                const q = query(collection(db, "chats", chatId, "messages"), orderBy("time", "asc"));
                this.unsubscribeChat = onSnapshot(q, (snap) => {
                    const cont = document.getElementById('chat-messages');
                    cont.innerHTML = "";
                    snap.forEach(m => {
                        const d = m.data();
                        const cls = d.sender === this.currentUser.username ? 'msg-me' : 'msg-them';
                        cont.innerHTML += `<div class="bubble ${cls}">${d.text}</div>`;
                    });
                    cont.scrollTop = cont.scrollHeight;
                });
            },

            async sendMessage() {
                const input = document.getElementById('msg-input');
                if(!input.value) return;
                const chatId = [this.currentUser.username, this.activeChat].sort().join("_");
                await addDoc(collection(db, "chats", chatId, "messages"), { text: input.value, sender: this.currentUser.username, time: serverTimestamp() });
                input.value = "";
            },

            // ADMIN PANEL
            async renderAdminPanel() {
                const main = document.getElementById('main-content');
                main.innerHTML = `<h3>Admin Panel</h3><input id="new-sch" placeholder="Yeni Okul Adı"><button class="btn-success" onclick="app.addSchool()">Okul Ekle</button><div id="admin-users"></div>`;
                const snap = await getDocs(collection(db, "users"));
                const list = document.getElementById('admin-users');
                snap.forEach(uDoc => {
                    const u = uDoc.data();
                    const item = document.createElement('div');
                    item.className = 'user-item';
                    item.innerHTML = `<span><span class="status-dot ${u.isBlocked ? 'status-blocked' : 'status-active'}"></span><b>${u.username}</b></span><small>${u.grade}/${u.section}</small>`;
                    item.onclick = () => this.openUserEdit(u);
                    list.appendChild(item);
                });
            },

            openUserEdit(user) {
                this.selectedEditUser = user;
                document.getElementById('admin-user-modal').classList.remove('hidden');
                document.getElementById('edit-user-title').innerText = user.username + " Ayarları";
                document.getElementById('edit-school').value = user.school;
                document.getElementById('edit-grade').value = user.grade;
                document.getElementById('edit-section').value = user.section;
                document.getElementById('block-btn').classList.toggle('hidden', user.isBlocked);
                document.getElementById('unblock-btn').classList.toggle('hidden', !user.isBlocked);
            },

            async adminUpdateStatus(status) {
                await updateDoc(doc(db, "users", this.selectedEditUser.username), { isBlocked: status });
                alert("Güncellendi!");
                this.renderAdminPanel();
                document.getElementById('admin-user-modal').classList.add('hidden');
            },

            async adminMakeLeader() {
                await updateDoc(doc(db, "users", this.selectedEditUser.username), { isLeader: true });
                alert("Başkan yapıldı!");
            },

            async saveUserEdits() {
                const up = { school: document.getElementById('edit-school').value, grade: document.getElementById('edit-grade').value, section: document.getElementById('edit-section').value };
                await updateDoc(doc(db, "users", this.selectedEditUser.username), up);
                alert("Bilgiler güncellendi!");
                this.renderAdminPanel();
                document.getElementById('admin-user-modal').classList.add('hidden');
            },

            async addSchool() {
                const name = document.getElementById('new-sch').value;
                if(!name) return;
                this.allSchools.push(name);
                await setDoc(doc(db, "config", "schools"), { list: this.allSchools });
                alert("Okul Eklendi!");
                this.renderAdminPanel();
                this.fetchSchools();
            },

            // SETTINGS
            renderSettings() {
                document.getElementById('main-content').innerHTML = `
                    <h3>Ayarlar</h3>
                    <div style="margin-top:15px;">
                        <input type="text" id="up-user" value="${this.currentUser.username}" placeholder="Yeni Kullanıcı Adı (Yalnızca Görünüm)">
                        <input type="password" id="up-pass" placeholder="Yeni Şifre">
                        <button class="btn-main" onclick="app.saveProfile()">Bilgileri Güncelle</button>
                        <hr style="margin:15px 0;">
                        <button class="btn-main" style="background:#34495e" onclick="document.body.classList.toggle('dark-mode')">Temayı Değiştir</button>
                    </div>
                `;
            },

            async saveProfile() {
                const pass = document.getElementById('up-pass').value;
                if(pass) {
                    await updateDoc(doc(db, "users", this.currentUser.username), { password: pass });
                    alert("Şifre Değiştirildi!");
                }
            }
        };

        window.app.init();
    </script>
</body>
</html>
